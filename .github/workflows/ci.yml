name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIXI_VERSION: v0.81.0
  UV_VERSION: "0.12.1"

jobs:
  lockfiles:
    name: lock files up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          manifest-path: pyproject.toml
          run-install: false
      # Non-zero if pyproject.toml changed without `pixi lock` (checks every environment, installs nothing). On a
      # mismatch it also rewrites pixi.lock in the checkout before failing; update the lock with pixi >= 0.81.
      - run: pixi lock --check
      # setup-uv publishes only full version tags (there is no floating `v10`), so pin one that exists.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv lock --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          manifest-path: pyproject.toml
          environments: dev
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      - run: pixi run -e dev lint

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v7
      # locked: `pixi install --locked`, which fails if pixi.lock is stale for the dev environment.
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          manifest-path: pyproject.toml
          environments: dev
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
      - run: pixi run -e dev versions
      - run: pixi run -e dev test

  uv:
    name: uv only (no conda tools)
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v7
      # What the README asks uv users to install for the PDF reports (weasyprint loads pango at import time).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # KERAS_BACKEND is deliberately not set: importing chrombpnet has to select JAX by itself.
      - run: uv sync --locked
      - run: uv run python -c "import chrombpnet, keras; assert keras.backend.backend() == 'jax', keras.backend.backend()"
      - run: uv run pytest -q -m "not gpu and not slow and not needs_cli"

  cuda13-env:
    # Installs the GPU environment (about 4 GB of NVIDIA wheels) on a CPU runner and imports it; JAX falls back
    # to the CPU. Skipped on pull requests to spare the runners and the Actions cache.
    name: cuda13 environment installs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CONDA_OVERRIDE_CUDA: "13.0"
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          manifest-path: pyproject.toml
          environments: cuda13
          locked: true
          cache: false
      - run: pixi run -e cuda13 versions
